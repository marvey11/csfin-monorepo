name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel in-progress runs for the same PR/branch when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - run: npm ci

      # Derives base and head SHAs for nx affected
      - uses: nrwl/nx-set-shas@v4

      # Clear Nx cache BEFORE setting environment variables
      - name: Clear Nx cache
        run: npx nx reset

      # Runs lint, test, and build targets for affected projects in parallel
      - name: Run affected commands
        env:
          NX_DAEMON: false
        run: npx nx affected -t lint test build --parallel=3
