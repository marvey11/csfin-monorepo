version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Nx tooling & plugins
      nx-ecosystem:
        patterns:
          - "nx"
          - "@nx/*"

      vitest-packages:
        patterns:
          - "vitest"
          - "@vitest/*"

      # NestJS framework & modules
      nestjs-ecosystem:
        patterns:
          - "@nestjs/*"

      # React ecosystem & types
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

      # Linting and static analysis
      linting-tools:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier*"

      # Catch-all for remaining minor/patch dev dependencies
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "nx"
          - "@nx/*"
          - "vitest"
          - "@vitest/*"
          - "@nestjs/*"
          - "react*"
          - "@types/react*"
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier*"

      # Catch-all for remaining minor/patch production dependencies
      prod-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@nestjs/*"
          - "react*"
